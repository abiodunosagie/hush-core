[package]
name = "hush-cli"
description = "Play calm and sleep sounds from the terminal on macOS, Linux and Windows."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["audio", "sleep", "noise", "binaural", "cli"]
categories = ["multimedia::audio", "command-line-utilities"]

[[bin]]
name = "hush"
path = "src/main.rs"

[dependencies]
hush-core = { path = "../hush-core", version = "0.1.0" }
cpal = "0.18"
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3"
